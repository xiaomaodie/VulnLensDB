name: Collect public database snapshot
on:
  workflow_dispatch:
  push:
    paths: ['tools/collect_library.py']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests packaging cvss
      - run: python -m tools.collect_library
      - uses: actions/upload-artifact@v4
        with:
          name: library-snapshot
          path: data/library/
          if-no-files-found: error
