{% extends "base.html" %}{% block body %}<h1>{{a.cve}}</h1><p>{{a.description}}</p><p>CVSS {{a.score if a.score is not none else '缺失'}} · {{a.author or '未给出'}} · {{a.published}}</p><a href="https://nvd.nist.gov/vuln/detail/{{a.cve}}">NVD 原始记录 ↗</a><h2>CPE 配置项</h2>{% for r in cpes %}<p><code>{{r|tojson}}</code></p>{% else %}<p>该记录未给出 CPE 匹配项。</p>{% endfor %}{% endblock %}
