services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    volumes:
      - ..:/workspaces/VulnLensDB:cached
    command: sleep infinity
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: vulnlens
      DB_USER: vulnlens
      DB_PASSWORD: codespaces-development-only
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vulnlens
      MYSQL_USER: vulnlens
      MYSQL_PASSWORD: codespaces-development-only
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  mysql-data:
